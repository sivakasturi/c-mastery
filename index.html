<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>C Mastery — Learn C from zero to pro</title>
  <meta name="description" content="Swipe through 100+ bite-sized cards to learn the C programming language, from Hello World to pointers, memory, data structures and pro-level techniques.">
  <meta name="theme-color" content="#11151c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%233b6fd8'/><text x='32' y='45' font-family='monospace' font-size='38' font-weight='700' fill='white' text-anchor='middle'>C</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Open course map" title="Course map (M)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <div class="brand"><span class="brand-mark">{C}</span><span class="brand-name">Mastery</span></div>
    <div class="progress-wrap" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
    <span class="counter" id="counter">1 / 1</span>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="stage" id="stage" aria-live="polite"></main>

  <nav class="controls">
    <button class="ctrl" id="prevBtn" aria-label="Previous card">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="ctrl learn" id="learnBtn" aria-pressed="false">
      <span class="learn-icon">✓</span><span class="learn-text">Mark as learned</span>
    </button>
    <button class="ctrl primary" id="nextBtn" aria-label="Next card">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </nav>
  <p class="hint" id="hint">Swipe the card · or use ← → keys</p>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Course map" aria-hidden="true">
    <div class="drawer-head">
      <h2>Course map</h2>
      <button class="icon-btn" id="closeDrawer" aria-label="Close course map">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="overall" id="overall"></div>
    <ol class="toc" id="toc"></ol>
    <button class="reset" id="resetBtn">Reset all progress</button>
  </aside>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/cards-1.js"></script>
  <script src="js/cards-2.js"></script>
  <script src="js/cards-3.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
